# Overlay on nav2.yaml; selected only by shared_control:=true.
controller_server:
  ros__parameters:
    FollowPath:
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist, HumanInfluence]
      HumanInfluence:
        class: mobile_openarm_shared_control::HumanInfluenceCritic
        scale: 1.0
        # Starting values: half the paper's 400/800 because path/goal costs here
        # are also half its 32/24. This is a tuning starting point, not equivalence.
        linear_weight: 200.0
        angular_weight: 400.0
        release_delay: 2.0
        input_timeout: 0.5
behavior_server:
  ros__parameters:
    # Keep recovery commands inside the supervised output limits too.
    max_rotational_vel: 0.65
shared_control:
  ros__parameters:
    enable_button: 4
    stop_button: 1  # B, verified on this Bluetooth Xbox controller (LB = 4).
    steering_axis: 0
    angular_sign: 1.0
    deadzone: 0.1
    max_linear: 0.3
    max_angular: 0.65
    joy_timeout: 0.5
    command_timeout: 0.5
game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.0  # One deadzone in shared_control; avoid applying it twice.
    autorepeat_rate: 20.0
